<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Kalix</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="site.css">
  <script src="site.js" defer></script>
</head>
<body class="site" data-page="login">
  <header data-site-header></header>

  <main class="site-main">
    <article class="phone">
      <div class="content padded">
        <div class="login-brand">
          <div data-brand></div>
          <p class="muted center">
            Seu agendamento de estética e beleza sem complicação.
          </p>
        </div>

        <div class="login-form">
          <div class="field">
            <span class="field-label">E-mail</span>
            <div class="field-display">nome@exemplo.com</div>
          </div>

          <div class="field">
            <span class="field-label">Senha</span>
            <div class="field-display">Sua senha secreta</div>
          </div>

          <p class="red small bold" style="text-align:right">
            Esqueci minha senha
          </p>

          <div class="action unavailable">Entrar</div>

          <div class="divider section-gap">OU ENTRE COM</div>

          <div class="two-columns">
            <div class="action outline">Google</div>
            <div class="action outline">Apple</div>
          </div>
        </div>

        <p class="login-footer muted">
          Não tem uma conta?
          <a class="text-link" href="cadastro.html">Criar conta</a>
        </p>

        <p class="site-note">
          Demonstração visual: não realiza autenticação.
        </p>
      </div>
    </article>
  </main>
</body>
</html>
