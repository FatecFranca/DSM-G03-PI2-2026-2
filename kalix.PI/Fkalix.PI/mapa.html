<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa — Kalix</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="site.css">
  <script src="site.js" defer></script>
</head>
<body class="site" data-page="mapa">
  <header data-site-header></header>

  <main class="site-main">
    <article class="phone">
      <header class="app-header" data-app-header=""></header>

      <div class="content">
        <div class="field-display has-value">◎ São Paulo, SP</div>

        <div class="chips section-gap">
          <span class="chip">Barbearia</span>
          <span class="chip">Estética</span>
          <span class="chip">Salão</span>
          <span class="chip">Aberto agora</span>
        </div>

        <div class="map-art" role="img" aria-label="Mapa ilustrativo">
          <div class="map-pin">Kalon Estética</div>
          <span class="map-note">Mapa ilustrativo, sem geolocalização</span>
        </div>

        <a class="action dark compact" href="inicio.html">
          Visualizar Lista
        </a>

        <div class="card row section-gap">
          <div class="photo compact">Foto da clínica</div>
          <div class="grow">
            <h4>Clínica Kalon Estética</h4>
            <p class="muted small">
              Rua Augusta, 1200 · Consolação (1.2 km)
            </p>
            <p class="small">
              <span class="star">★</span> 4.9
              <span class="subtle">(142 avaliações)</span>
            </p>
            <a class="text-link small" href="estabelecimento.html">
              Ver serviços &amp; horários
            </a>
          </div>
        </div>
      </div>

      <nav class="bottom-nav" data-bottom-nav="mapa"></nav>
    </article>
  </main>
</body>
</html>
